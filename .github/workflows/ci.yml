name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 构建与浏览器冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-browser
          path: .tmp/smoke
          if-no-files-found: ignore

  desktop:
    name: 桌面端冒烟
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run smoke:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-desktop
          path: .tmp/smoke
          if-no-files-found: ignore
