name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 重新发布的版本号，留空则用 package.json 的版本
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify:
    name: 版本校验与冒烟
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: lockfile 只能指向公开源
        run: npm run check:lockfile
      - run: npm ci
      - name: 确定版本号并与 package.json 对齐
        id: version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
            [ -n "$version" ] || version="$pkg"
          fi
          test "$version" = "$pkg" || { echo "版本 $version 与 package.json 的 $pkg 不一致"; exit 1; }
          echo "版本校验通过：$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: npm run build
      - run: npm run check:license
      - run: npm run smoke

  # 桌面壳冒烟必须在出包前通过，不能只靠 PR 阶段的 CI。
  desktop:
    name: 桌面端冒烟
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: lockfile 只能指向公开源
        run: npm run check:lockfile
      - run: npm ci
      - run: npm run smoke:desktop

  dist:
    name: 出包 ${{ matrix.os }}
    needs: [verify, desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-24.04
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 补齐 Electron / Chromium 许可文本
        run: npm run licenses:electron
      - run: npm run check:license:pack
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - name: 启动冒烟（打包产物）
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            macos-14) exe="release/mac-arm64/cf-transport-ship.app/Contents/MacOS/cf-transport-ship" ;;
            ubuntu-24.04) exe="release/linux-unpacked/cf-transport-ship" ;;
            windows-latest) exe="release/win-unpacked/cf-transport-ship.exe" ;;
          esac
          test -f "$exe" || { echo "找不到打包产物 $exe"; ls -la release; exit 1; }
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a env SMOKE_EXE="$exe" node smoke-desktop-launch.mjs
          else
            env SMOKE_EXE="$exe" node smoke-desktop-launch.mjs
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  publish:
    name: 发布到 GitHub Release
    needs: [verify, desktop, dist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 确认版本号已从 verify 传出
        run: |
          v="${{ needs.verify.outputs.version }}"
          test -n "$v" || { echo "verify 未传出版本号，中止发布"; exit 1; }
          echo "准备发布 v$v"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 生成 sha256
        # GitHub 上传时会把文件名里的空格换成点号，先把本地名字对齐，
        # 否则 SHA256SUMS.txt 里的文件名与页面上的下载名对不上。
        run: |
          cd artifacts
          for f in *; do
            n="${f// /.}"
            [ "$f" = "$n" ] || mv "$f" "$n"
          done
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
