name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 重新发布的版本号，留空则用 package.json 的版本
        required: false
        default: ''

permissions:
  contents: write

jobs:
  verify:
    name: 版本校验与冒烟
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: lockfile 只能指向公开源
        run: npm run check:lockfile
      - run: npm ci
      - name: 确定版本号并与 package.json 对齐
        id: version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
            [ -n "$version" ] || version="$pkg"
          fi
          test "$version" = "$pkg" || { echo "版本 $version 与 package.json 的 $pkg 不一致"; exit 1; }
          echo "版本校验通过：$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - run: npm run smoke

  dist:
    name: 出包 ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-24.04
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  publish:
    name: 发布到 GitHub Release
    needs: [verify, dist]
    runs-on: ubuntu-24.04
    steps:
      - name: 确认版本号已从 verify 传出
        run: |
          v="${{ needs.verify.outputs.version }}"
          test -n "$v" || { echo "verify 未传出版本号，中止发布"; exit 1; }
          echo "准备发布 v$v"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 生成 sha256
        # GitHub 上传时会把文件名里的空格换成点号，先把本地名字对齐，
        # 否则 SHA256SUMS.txt 里的文件名与页面上的下载名对不上。
        run: |
          cd artifacts
          for f in *; do
            n="${f// /.}"
            [ "$f" = "$n" ] || mv "$f" "$n"
          done
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.verify.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
